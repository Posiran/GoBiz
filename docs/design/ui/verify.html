<!doctype html><html lang="fa" dir="rtl"><head><title>احراز موبایل | Gobiz</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v28.0.0/dist/font-face.css"><style>:root{--bg:#eef1f4;--card:#fff;--ink:#16212d;--mute:#617080;--line:#d8dee5;--accent:#f2b705;--ok:#1d7a4e;font-family:Vazir,IRANSans,Vazirmatn,Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.9 Vazir,IRANSans,Vazirmatn,Tahoma,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px 18px}.top{background:#16212d;color:#fff;padding:8px 0;font-size:12px}.nav{background:#fff;border-bottom:1px solid var(--line)}.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:900;color:#16212d;text-decoration:none}.btn{border:1px solid var(--ink);border-radius:9px;padding:9px 14px;background:#fff;color:var(--ink);text-decoration:none;font:inherit}.btn.primary{background:var(--ink);color:#fff}.btn.accent{background:var(--accent);border-color:var(--accent);font-weight:800}.card{max-width:470px;margin:45px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 12px 35px rgba(22,33,45,.08)}h1{margin:0 0 7px;font-size:27px}.muted{color:var(--mute)}label{display:block;color:var(--mute);font-size:12px;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfd;color:var(--ink);font:inherit}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.notice{margin-top:14px;padding:11px;border:1px solid #c9d9ed;background:#f6faff;border-radius:9px;color:#355b80}.otp{direction:ltr;text-align:center;font-size:25px;letter-spacing:8px;font-weight:800}.footer{margin-top:50px;border-top:1px solid var(--line);padding:20px 0;color:var(--mute);font-size:12px}@media(max-width:600px){.card{margin:25px auto;padding:21px}.actions{flex-direction:column}.actions .btn{width:100%;text-align:center}}</style></head><body><div class="top"><div class="wrap">Gobiz · احراز هویت امن با OTP</div></div><div class="nav"><div class="wrap"><a class="brand" href="index.html">Gobiz</a><a class="btn" href="index.html">بازگشت به خانه</a></div></div><main class="wrap"><form class="card" onsubmit="event.preventDefault();alert('شماره موبایل تأیید شد');location.href='seller-dashboard.html'"><h1>احراز شماره موبایل</h1><p class="muted">کد OTP ارسال‌شده توسط IPPanel را وارد کنید.</p><label>کد تأیید</label><input class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="5" placeholder="12345" required><div class="actions"><button class="btn primary" type="submit">تأیید شماره</button><button class="btn" type="button" onclick="alert('کد نمونه ارسال شد')">ارسال دوباره</button></div></form></main><div class="footer"><div class="wrap">Gobiz · Prototype UI</div></div></body></html>
